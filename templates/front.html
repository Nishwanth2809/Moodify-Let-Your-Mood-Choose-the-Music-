<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodify - Let Your Mood Choose the Music</title>

    <!-- Whisper Model (Browser) -->
    <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers/dist/transformers.min.js"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            background-color: #1e1e2e;
            color: white;
            text-align: center;
            font-family: Arial;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        input,
        select {
            padding: 10px;
            width: 60%;
            border-radius: 6px;
            border: none;
            margin-top: 10px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 5px;
            margin: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        #recordButton {
            background: #ff4757;
            color: white;
        }

        #recordButton.recording {
            background: #2ed573;
        }

        #analyzeTextButton {
            background: #3498db;
            color: white;
        }

        #clearButton {
            background: #888;
            color: white;
        }

        #songList .song {
            background: #2c2c54;
            padding: 10px;
            margin: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .song img {
            width: 50px;
            height: 50px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <h1>Moodify — Let Your Mood Choose Music 🎵</h1>

    <input type="text" id="textInput" placeholder="Type your mood...">

    <br>
    <select id="languageSelect">
        <option value="english">English</option>
        <option value="hindi">Hindi</option>
        <option value="telugu">Telugu</option>
    </select>

    <br>
    <button id="analyzeTextButton">Analyze Mood</button>
    <button id="clearButton">Clear</button>

    <br><br>
    <button id="recordButton" disabled>🎙 Start Recording</button>
    <p id="status">Loading voice model... ⏳</p>

    <h2 id="moodResult"></h2>
    <div id="songList"></div>

    <script>
        let mediaRecorder;
        let chunks = [];
        let isRecording = false;
        let whisperModel = null;
        let modelLoaded = false;

        // -------------------------------------
        // Load Whisper Tiny Model (Fastest)
        // -------------------------------------
        async function loadWhisper() {
            document.getElementById("status").innerText = "Loading voice model... ⏳";

            try {
                whisperModel = await transformers.pipeline(
                    "automatic-speech-recognition",
                    "Xenova/whisper-tiny"
                );

                modelLoaded = true;
                document.getElementById("status").innerText = "Voice model ready 🎤";
                document.getElementById("recordButton").disabled = false;

            } catch (error) {
                console.error("Model load error:", error);
                document.getElementById("status").innerHTML =
                    `Failed to load model ❌ 
                    <button onclick='loadWhisper()'>Retry</button>`;
            }
        }

        // Timeout fallback if loading is slow
        setTimeout(() => {
            if (!modelLoaded) {
                document.getElementById("status").innerHTML =
                    `Still loading... ⚠️ 
                    <button onclick='loadWhisper()'>Retry</button>`;
            }
        }, 15000);

        loadWhisper();


        // -------------------------------------
        // Recording Controls
        // -------------------------------------
        document.getElementById("recordButton").onclick = function () {
            if (!modelLoaded) {
                alert("Voice model still loading. Please wait.");
                return;
            }
            if (!isRecording) startRecording();
            else stopRecording();
        };

        async function startRecording() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);

            chunks = [];
            mediaRecorder.start();
            isRecording = true;

            document.getElementById("recordButton").classList.add("recording");
            document.getElementById("recordButton").innerText = "⏹ Stop Recording";
            document.getElementById("status").innerText = "Recording... 🎙";

            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => processAudio();
        }

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;

            document.getElementById("recordButton").classList.remove("recording");
            document.getElementById("recordButton").innerText = "🎙 Start Recording";
            document.getElementById("status").innerText = "Processing audio...";
        }


        // -------------------------------------
        // Process Audio
        // -------------------------------------
        async function processAudio() {
            const blob = new Blob(chunks, { type: "audio/webm" });
            const arrayBuffer = await blob.arrayBuffer();

            try {
                const textResult = await whisperModel(arrayBuffer);
                const text = textResult.text || "";

                document.getElementById("status").innerText = "Sending to server...";

                // Send for mood detection + tempo + pitch
                $.ajax({
                    url: "/voice",
                    method: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({
                        audio: await blobToBase64(blob),
                        text: text,
                        language: document.getElementById("languageSelect").value
                    }),
                    success: showResults,
                    error: () => alert("Error processing voice input.")
                });

            } catch (err) {
                console.error(err);
                alert("Whisper transcription failed.");
            }
        }

        function blobToBase64(blob) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(",")[1]);
                reader.readAsDataURL(blob);
            });
        }


        // -------------------------------------
        // Text Input Mood
        // -------------------------------------
        document.getElementById("analyzeTextButton").onclick = function () {
            let text = document.getElementById("textInput").value.trim();
            let language = document.getElementById("languageSelect").value;

            if (!text) return alert("Enter text first.");

            $.ajax({
                url: "/text",
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify({ text, language }),
                success: showResults
            });
        };


        // -------------------------------------
        // Display Results
        // -------------------------------------
        function showResults(response) {
            if (response.error) {
                document.getElementById("moodResult").innerText = "Error: " + response.error;
                return;
            }

            document.getElementById("moodResult").innerHTML =
                `Detected Mood: <b>${response.mood.toUpperCase()}</b>`;

            let list = document.getElementById("songList");
            list.innerHTML = "";

            if (!response.songs?.length) {
                list.innerHTML = "<p>No songs found.</p>";
                return;
            }

            response.songs.forEach(song => {
                list.innerHTML += `
                    <div class="song">
                        <img src="${song.cover}">
                        <div>
                            <b>${song.name}</b><br>
                            ${song.artist}<br>
                            <a href="${song.spotify_url}" target="_blank">Open in Spotify</a>
                        </div>
                    </div>
                `;
            });
        }


        // -------------------------------------
        // Clear Button
        // -------------------------------------
        document.getElementById("clearButton").onclick = function () {
            document.getElementById("textInput").value = "";
            document.getElementById("moodResult").innerHTML = "";
            document.getElementById("songList").innerHTML = "";
            document.getElementById("status").innerHTML = "";
        };
    </script>

</body>

</html>
